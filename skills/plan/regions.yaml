# Land-unit registry for pnw-outdoor-planner. Merged 2026-10-20 from the WA/NPS and OR/ID/BC halves.
# A point may sit in several boxes (a wilderness inside its forest, a statewide program over everything); the resolver lists the smallest first.
# Every 'verify_by' is a date before which that season or permit entry must be re-checked; the resolver warns past it and never refuses.
# Page URLs were checked with HEAD on 2026-10-20; recreation.gov answers HEAD with 405 and GET with 200, so those were checked by GET.
verified:
  watchduty_center:
    status: confirmed_from_app_bundle
    form: https://app.watchduty.org/@{lat},{lng},{zoom}
    example: https://app.watchduty.org/@47.6,-121.5,9
    variant_without_zoom: https://app.watchduty.org/@{lat},{lng}
    confirmed_how: Fetched https://app.watchduty.org/ and its Vite bundle (assets/index-*.js). The client route table contains the patterns /@:lat,:lng,:zoom and /@:lat,:lng, plus /@:lat,:lng,:zoom/pin and /@:lat,:lng/pin. Query parameters lat, lng, zoom were searched for and are not read for the map view; the only map-related query keys are mapMode, search, searchType, ownership, urgency, metadata. The static host returns HTTP 200 for the /@ path (it serves the single-page app for any path), so the HTTP check alone proves nothing; the route table is the evidence.
    not_confirmed: No browser was available, so the rendered map position was not observed. Zoom is assumed to be a Mapbox zoom level (0 to 22). Ask for a human spot check once.
    tried_and_absent: '?lat=&lng=&zoom= query form and #zoom/lat/lng hash form: no handler found in the bundle (the Mapbox GL Hash class ships in the bundle but no map instance enables it).'
  arcgis_experience_center:
    status: documented_form_confirmed_against_app_config_not_rendered
    form: https://experience.arcgis.com/experience/3d9f1901932d4b089f01be06885f3e22/page/Welcome#widget_142=center:{lon}%2C{lat}%2C4326
    scale_or_level: append ,scale:{scaleValue} or ,level:{zoomLevel} after the center value, comma separated, per the Esri Experience Builder URL parameters documentation
    example: https://experience.arcgis.com/experience/3d9f1901932d4b089f01be06885f3e22/page/Welcome#widget_142=center:-121.5%2C47.9%2C4326%2Clevel:9
    confirmed_how: 'Esri documents the hash form #<mapWidgetID>=center:<x,y,wkid> for Experience Builder 1.x (commas inside the value must be percent-encoded as %2C). The app config (arcgis.com/sharing/rest/content/items/3d9f1901932d4b089f01be06885f3e22/data) reports exbVersion 1.19.0 and gives the map widget id per page: Welcome = widget_142 (forest-wide), Mt. Baker Hwy = widget_152, Baker Lake Rd = widget_160, North Cascades Hwy = widget_165, Suiattle River Rd = widget_170, Mountain Loop Hwy = widget_175, US Hwy 2 = widget_180, I-90 = widget_185, Mather Memorial Pkwy = widget_190, Carbon River Hwy = widget_195. The Road and Trail List page has no map. The query-string form ?center=lon,lat&level=N is an ArcGIS Instant Apps convention and is not part of Experience Builder.'
    not_confirmed: No browser was available, so the rendered recentering was not observed. WKID 4326 (lon,lat) is accepted by Esri's Point model but the docs example uses 102100 (Web Mercator meters); if 4326 fails, convert to 102100. The Experience's isUseCustomMapState is false, so initial extent comes from each web map and the hash overrides it.
    corridor_pages: Corridor page slugs were not verified; address the forest-wide map through the Welcome page plus the hash, or name the corridor tab in the report.
