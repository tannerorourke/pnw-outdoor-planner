- id: mora_np
  name: Mount Rainier National Park
  kind: national_park
  manager: NPS
  jurisdiction: WA
  bbox:
  - -122.1
  - 46.7
  - -121.4
  - 47.05
  pages:
    alerts: https://www.nps.gov/mora/planyourvisit/conditions.htm
    conditions: https://www.nps.gov/mora/planyourvisit/trails-and-backcountry-camp-conditions.htm
    roads: https://www.nps.gov/mora/planyourvisit/road-status.htm
    permits: https://www.nps.gov/mora/planyourvisit/wilderness-camping-and-hiking.htm
  permits:
  - name: Mount Rainier wilderness and climbing permits
    system: recreation.gov
    url: https://www.recreation.gov/permits/4675317
    walkup: 'Wilderness permits: first-come walk-up at Longmire and White River Wilderness Information Centers, and Paradise Guide House for climbing, generally late May through early September; Carbon River ranger station by season. Winter climbing is self-registration after paying the per-person fee on Pay.gov. Reservation quota season is summer; permit requirement is year-round for overnight stays and for glaciers or above about 10,000 ft.'
    verify_by: 2027-03-01
  seasons:
  - name: Timed entry (Paradise corridor and Sunrise)
    kind: timed_entry
    window:
      start: 07-01
      end: 09-30
    note: Pilot ran 2024 and 2025 (2025 Sunrise only). Recreation.gov states no timed entry for any part of the park in 2026. Re-verify before 2027; window is a placeholder for the last pilot.
    verify_by: 2027-03-01
  - name: Sunrise road
    kind: road
    window:
      start: 07-01
      end: 10-15
    note: Typical; varies. Opens when snow clears, usually early July, and closes with the first heavy snow. Sunrise road was closed to vehicles for the 2026 season at last check.
    verify_by: 2027-05-15
  - name: SR 410 Chinook Pass and SR 123 Cayuse Pass (park east side)
    kind: road
    window:
      start: 05-25
      end: 11-15
    note: Typical; varies. WSDOT announces open and close yearly. Closed passes cut Sunrise, White River, and Ohanapecosh off from the east.
    verify_by: 2027-04-15
  - name: Paradise road winter night gate
    kind: gate
    window:
      start: 10-20
      end: 05-20
    note: Nisqually entrance to Paradise is open in winter weather permitting; the road gate closes nightly from about late October and chains are required. Wraps the year end; varies.
    verify_by: 2027-09-30
  - name: Carbon River Road and Mowich Lake access
    kind: road
    window:
      start: 07-01
      end: 10-15
    note: Carbon River Road is closed to vehicles past the entrance; Mowich Lake Road access from SR 165 was cut off by a closed bridge (WSDOT 2025 release). Check the road status page.
    verify_by: 2027-05-15
  webcams:
  - name: Mount Rainier NPS webcams
    url: https://www.nps.gov/mora/learn/photosmultimedia/webcams.htm
  notes: 'Gates and passes decide access: the east side depends on SR 410 and SR 123, Sunrise on its own seasonal road. Climbing needs a registration plus permit in every season; summer reservations sell out.'
